global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "llm-orchestrator"
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-orchestrator:8000"]

  - job_name: "rag-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-service:8002"]

  - job_name: "anomaly-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["anomaly-service:8001"]

  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]