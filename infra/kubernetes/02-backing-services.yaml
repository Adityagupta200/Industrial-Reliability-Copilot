# Production StorageClass for stateful vector DB workloads on EKS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-default
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: industrial-copilot
spec:
  storageClassName: gp3-default
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Qdrant Vector DB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.18.0
        ports:
        - containerPort: 6333
        - containerPort: 6334
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /readyz
            port: 6333
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: 6333
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: 6333
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: qdrant-storage-volume
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage-volume
        persistentVolumeClaim:
          claimName: qdrant-storage
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        lifecycle:
          postStart:
            exec:
              command: 
                - "/bin/sh"
                - "-c"
                - "sleep 10 && ollama pull llama3.1:8b"
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi" 
            cpu: "4000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
