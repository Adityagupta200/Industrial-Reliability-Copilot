# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: copilot-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: copilot-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: copilot-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: industrial-copilot
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# Qdrant Vector DB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333

---
# Ollama
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        # In a real cluster, GPU node reservations go here
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434