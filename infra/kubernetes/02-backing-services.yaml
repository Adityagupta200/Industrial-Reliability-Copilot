# PRODUCTION FIX: Added Persistent Volume Claim for Vector DB statefulness
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: industrial-copilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Qdrant Vector DB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
        # Attach the persistent volume to the container
        volumeMounts:
        - name: qdrant-storage-volume
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-storage-volume
        persistentVolumeClaim:
          claimName: qdrant-storage
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: industrial-copilot
spec:
  selector:
    app: qdrant
  ports:
  - port: 6333
    targetPort: 6333

---
# Ollama
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        lifecycle:
          postStart:
            exec:
              command: 
                - "/bin/sh"
                - "-c"
                - "sleep 10 && ollama pull llama3.1:8b"
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi" 
            cpu: "4000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: industrial-copilot
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434