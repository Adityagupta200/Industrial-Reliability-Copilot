# 1. RAG Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: industrial-copilot
spec:
  replicas: 1 # PRODUCTION FIX: Reduced from 2 to 1 to prevent cluster memory starvation
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
      - name: rag-service
        # PRODUCTION FIX: Point to AWS ECR instead of local Minikube cache
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/rag-service:v1.2
        imagePullPolicy: Always # PRODUCTION FIX: Force EKS to pull from cloud registry
        envFrom:
        - configMapRef:
            name: copilot-config
        - secretRef:
            name: copilot-secrets
        ports:
        - containerPort: 8002
        resources:
          requests:
            memory: "1.5Gi" # Accommodates BGE-Large
            cpu: "500m"
          limits:
            memory: "4Gi"   # Prevents OOMKilled during inference spikes
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8002
          failureThreshold: 60    # Gives up to 10 minutes (60 * 10s) for model download
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      # Breathing room for heavy retrieval
          failureThreshold: 10    # Prevents pod termination during CPU spikes
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      # Prevents removal from internal routing 
          failureThreshold: 10    
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: industrial-copilot
spec:
  selector:
    app: rag-service
  ports:
  - port: 8002
    targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-service-hpa
  namespace: industrial-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-service
  minReplicas: 1 # PRODUCTION FIX: Lowered floor to match base replicas
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

