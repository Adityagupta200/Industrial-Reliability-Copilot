# 3. LLM Orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-orchestrator
  namespace: industrial-copilot
spec:
  replicas: 1 # PRODUCTION FIX
  selector:
    matchLabels:
      app: llm-orchestrator
  template:
    metadata:
      labels:
        app: llm-orchestrator
    spec:
      containers:
      - name: llm-orchestrator
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/llm-orchestrator:v1.2
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: copilot-config
        env:
        # STRATEGIC API COMPROMISE: Inject API Key for Production SLA
        - name: LLM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: copilot-secrets
              key: OPENAI_API_KEY
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"   
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-orchestrator
  namespace: industrial-copilot
spec:
  selector:
    app: llm-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: industrial-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-orchestrator
  minReplicas: 1 # PRODUCTION FIX
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
# 4. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: industrial-copilot
spec:
  replicas: 1 # PRODUCTION FIX
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:v1.2
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: copilot-config
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          failureThreshold: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      
          failureThreshold: 10    
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      
          failureThreshold: 10    
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: industrial-copilot
  annotations:
    # Instructs AWS ELB / K8s Nginx to keep connections open for up to 10 minutes
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "600"
spec:
  type: LoadBalancer 
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000