# 4. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: industrial-copilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: irc-api-gateway-local:v1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: copilot-config
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: industrial-copilot
spec:
  type: LoadBalancer 
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000