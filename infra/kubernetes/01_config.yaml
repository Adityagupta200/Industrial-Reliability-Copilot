apiVersion: v1
kind: Namespace
metadata:
  name: industrial-copilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: copilot-config
  namespace: industrial-copilot
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_DB: "industrial_maintenance"
  POSTGRES_USER: "irc"
  QDRANT_URL: "http://qdrant:6333"
  RAG_SERVICE_URL: "http://rag-service:8002"
  ANOMALY_SERVICE_URL: "http://anomaly-service:8001"
  ORCHESTRATOR_URL: "http://llm-orchestrator:8000"
  
  # Proven Production Configuration
  EMBEDDING_PROVIDER: "bge"
  BGE_MODEL_NAME: "BAAI/bge-large-en-v1.5"
  EMBEDDING_MODEL_NAME: "BAAI/bge-large-en-v1.5"
  EMBEDDING_NORMALIZE: "true"
  
  # Hybrid Cloud/Local Intelligence
  LLM_PRIMARY_PROVIDER: "openai"
  LLM_FALLBACK_PROVIDER: "ollama"
  LLM_OLLAMA_BASE_URL: "http://ollama:11434"
  LLM_OLLAMA_MODEL: "llama3.1:8b"
---
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
  namespace: industrial-copilot
type: Opaque
stringData:
  # PRODUCTION FIX: Pointing DSN directly to AWS RDS instead of internal cluster
  POSTGRES_PASSWORD: "ProductionPassword123!" 
  POSTGRES_DSN: "postgresql+psycopg://irc:ProductionPassword123!${AWS_RDS_ENDPOINT}:5432/industrial_maintenance"
  INCIDENTS_DB_DSN: "postgresql+psycopg://irc:ProductionPassword123!${AWS_RDS_ENDPOINT}:5432/industrial_maintenance"
  
  # Replace this with your actual OpenAI API key before running `kubectl apply`
  OPENAI_API_KEY: ${OPENAI_API_KEY}