# 3. LLM Orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-orchestrator
  namespace: staging
spec:
  replicas: 4 # Phase 11 production baseline for sustained 50 QPS validation
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 900
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-orchestrator
  template:
    metadata:
      labels:
        app: llm-orchestrator
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
      - name: wait-for-telemetry-db
        image: python:3.11-slim
        envFrom:
        - secretRef:
            name: copilot-secrets
        command:
        - /bin/sh
        - -c
        - |
          python - <<'PY'
          import os
          import socket
          import time
          from urllib.parse import urlparse

          dsn = os.environ.get("INCIDENTS_DB_DSN", "")
          parsed = urlparse(dsn)
          host = parsed.hostname

          try:
              port = parsed.port or 5432
          except ValueError as exc:
              raise SystemExit(f"Invalid INCIDENTS_DB_DSN port: {exc}") from exc

          if not host or host in {"localhost", "127.0.0.1", "postgres"}:
              raise SystemExit(
                  f"Invalid INCIDENTS_DB_DSN host for EKS/RDS deployment: {host!r}"
              )

          for attempt in range(1, 31):
              try:
                  with socket.create_connection((host, port), timeout=5):
                      print(f"Telemetry DB reachable at {host}:{port}")
                      raise SystemExit(0)
              except OSError as exc:
                  print(
                      f"Waiting for telemetry DB {host}:{port} "
                      f"attempt {attempt}/30: {exc}",
                      flush=True,
                  )
                  time.sleep(10)

          raise SystemExit(f"Telemetry DB not reachable at {host}:{port}")
          PY
      containers:
      - name: llm-orchestrator
        image: 519245966025.dkr.ecr.ap-south-1.amazonaws.com/llm-orchestrator:phase11-20260605135326-f455ea6
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: copilot-config
        - secretRef:
            name: copilot-secrets
        env:
        # Explicit alias expected by the orchestrator LLM settings.
        - name: LLM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: copilot-secrets
              key: OPENAI_API_KEY
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"   
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-orchestrator
  namespace: staging
spec:
  selector:
    app: llm-orchestrator
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-orchestrator
  minReplicas: 4
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

---
# 4. API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: staging
spec:
  replicas: 3 # Production edge baseline for 50 QPS validation plus HA
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - name: api-gateway
        image: 519245966025.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:phase11-20260605135326-f455ea6
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: copilot-config
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health/live
            port: 8000
          failureThreshold: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      
          failureThreshold: 10    
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 10      
          failureThreshold: 10    
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: staging
  annotations:
    # Instructs AWS ELB / K8s Nginx to keep connections open for up to 10 minutes
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "600"
spec:
  type: LoadBalancer 
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
