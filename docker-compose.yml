services:
  postgres:
    image: postgres:16-alpine
    container_name: irc-postgres
    environment:
      POSTGRES_DB: industrial_maintenance
      POSTGRES_USER: irc
      POSTGRES_PASSWORD: irc_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - irc_pgdata:/var/lib/postgresql/data
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irc -d industrial_maintenance"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: irc-qdrant-local:latest
    build:
      context: .
      dockerfile: qdrant.Dockerfile
    container_name: irc-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - irc_qdrant:/qdrant/storage
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # --- Phase 7: Added Anomaly Service ---
  anomaly-service:
    image: irc-anomaly-service-local:latest
    container_name: irc-anomaly-service
    build:
      context: .
      dockerfile: src/anomaly_service/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./src/anomaly_service:/app/src/anomaly_service:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      [
        "uvicorn",
        "anomaly_service.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*"
      ]
    healthcheck:
      # Updated to Phase 7 Readiness Probe
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  rag-service:
    image: irc-rag-service-local:latest
    container_name: irc-rag-service
    build:
      context: .
      dockerfile: src/rag_service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      INCIDENTS_DB_DSN: postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      HOST: 0.0.0.0
      PORT: "8002"
      PYTHONPATH: /app/src
      EMBEDDING_PROVIDER: bge
      BGE_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_NORMALIZE: "true"
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - irc_rag_processed:/app/data/processed
      - ./src/rag_service:/app/src/rag_service:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "rag_service.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--log-level",
        "debug"
      ]
    healthcheck:
      # Updated to Phase 7 Readiness Probe
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-model-puller:
    image: ollama/ollama:latest
    container_name: irc-ollama-init
    volumes:
      - irc_ollama_data:/root/.ollama
    networks:
      - irc_network
    dns:
      - 8.8.8.8
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull llama3.2:1b && ollama pull llama3.2:3b"

  ollama:
    image: ollama/ollama:latest
    container_name: irc-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - irc_ollama_data:/root/.ollama
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # -----------------------------------------------------------------------
    # SRE/MLOPS NOTE:
    # In a true enterprise production environment, this block would be
    # uncommented to assign dedicated GPU resources to the inference server.
    # -----------------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      ollama-model-puller:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  llm-orchestrator:
    image: irc-llm-orchestrator-local:latest
    container_name: irc-llm-orchestrator
    build:
      context: .
      dockerfile: src/llm_orchestrator/Dockerfile
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app/src
      - RAG_SERVICE_URL=http://rag-service:8002
      - ANOMALY_SERVICE_URL=http://anomaly-service:8001
      - INCIDENTS_DB_DSN=postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      - LLM_OPENAI_API_KEY=sk-mock-key-for-local-testing
      - LLM_PRIMARY_PROVIDER=ollama
      - LLM_FALLBACK_PROVIDER=ollama
      - LLM_OLLAMA_BASE_URL=http://ollama:11434
      - LLM_OLLAMA_MODEL=llama3.2:1b
      - LLM_REQUEST_TIMEOUT_S=600.0
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      rag-service:
        condition: service_healthy
      anomaly-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "llm_orchestrator.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--loop",
        "asyncio"
      ]
    volumes:
      - ./src/llm_orchestrator:/app/src/llm_orchestrator:ro
      - ./src/evaluation:/app/src/evaluation:ro
    healthcheck:
      # Updated to Phase 7 Readiness Probe
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # --- Phase 7: Added API Gateway ---
  api-gateway:
    image: irc-api-gateway-local:latest
    container_name: irc-api-gateway
    build:
      context: .
      dockerfile: src/api_gateway/Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app/src
      # Gateway forwards external requests specifically to the Orchestrator
      - ORCHESTRATOR_URL=http://llm-orchestrator:8000 
    ports:
      # This serves as the single entry point to the system mimicking the Load Balancer
      - "127.0.0.1:8000:8000" 
    volumes:
      - ./src/api_gateway:/app/src/api_gateway:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      llm-orchestrator:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "api_gateway.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  irc_network:
    driver: bridge
    name: irc_internal_network

volumes:
  irc_pgdata:
  irc_qdrant:
  irc_rag_processed:
  irc_ollama_data: