services:
  postgres:
    image: postgres:16-alpine
    container_name: irc-postgres
    environment:
      POSTGRES_DB: industrial_maintenance
      POSTGRES_USER: irc
      POSTGRES_PASSWORD: irc_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - irc_pgdata:/var/lib/postgresql/data
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irc -d industrial_maintenance"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: irc-qdrant-local:latest
    build:
      context: .
      dockerfile: qdrant.dockerfile
    container_name: irc-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - irc_qdrant:/qdrant/storage
    networks:
      - irc_network
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  anomaly-service:
    image: irc-anomaly-service-local:latest
    container_name: irc-anomaly-service
    build:
      context: .
      dockerfile: src/anomaly_service/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # PRODUCTION FIX: Read-only mount to prevent WSL sync freezes
      - ./src:/app/src:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      [
        "uvicorn",
        "anomaly_service.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  rag-service:
    image: irc-rag-service-local:latest
    container_name: irc-rag-service
    build:
      context: .
      dockerfile: src/rag_service/Dockerfile
    env_file:
      - .env  
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      INCIDENTS_DB_DSN: postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      HOST: 0.0.0.0
      PORT: "8002"
      PYTHONPATH: /app/src
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
      HUGGINGFACE_EMBEDDING_MODEL: ${HUGGINGFACE_EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_NORMALIZE: "true"
      HF_HOME: /app/data/hf_cache
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/raw:/app/data/raw:rw
      - irc_rag_processed:/app/data/processed
      - irc_hf_cache:/app/data/hf_cache
      # PRODUCTION FIX: Read-only mount to prevent WSL sync freezes
      - ./src:/app/src:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "rag_service.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--log-level",
        "info"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ollama-model-puller:
    image: ollama/ollama:latest
    container_name: irc-ollama-init
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - irc_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama API to settle..."
        sleep 5
        echo "Pulling llama3.1 for local background tasks..."
        ollama pull llama3.1
        echo "Model successfully pulled into the volume!"
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: irc-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - irc_ollama_data:/root/.ollama
    networks:
      - irc_network
    deploy:
      resources:
        limits:
          memory: 6G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  llm-orchestrator:
    image: irc-llm-orchestrator-local:latest
    container_name: irc-llm-orchestrator
    build:
      context: .
      dockerfile: src/llm_orchestrator/Dockerfile
    env_file:
      - .env  
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      # Keep local Phase 10 trace/demo runs aligned with the working tree while
      # preserving an immutable-image path for Kubernetes and CI.
      - ./src:/app/src:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app/src
      - RAG_SERVICE_URL=http://rag-service:8002
      - ANOMALY_SERVICE_URL=http://anomaly-service:8001
      - INCIDENTS_DB_DSN=postgresql+asyncpg://irc:irc_password@postgres:5432/industrial_maintenance
      - LLM_PRIMARY_PROVIDER=openai
      - LLM_FALLBACK_PROVIDER=ollama
      - LLM_OLLAMA_BASE_URL=http://ollama:11434
      - LLM_OLLAMA_MODEL=llama3.1
      - LLM_OPENAI_API_KEY=${OPENAI_API_KEY}
      - ROOT_CAUSE_FAST_PATH_ENABLED=${ROOT_CAUSE_FAST_PATH_ENABLED:-true}
      - OUTPUT_GUARDRAILS_LLM_JUDGE_MODE=${OUTPUT_GUARDRAILS_LLM_JUDGE_MODE:-fallback}
      - OUTPUT_GUARDRAILS_LLM_JUDGE_PROVIDER=${OUTPUT_GUARDRAILS_LLM_JUDGE_PROVIDER:-openai}
      # LangSmith variables pulled dynamically from .env at runtime
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-industrial-reliability-copilot}
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      rag-service:
        condition: service_healthy
      anomaly-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-model-puller:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "llm_orchestrator.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--loop",
        "asyncio"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    image: irc-api-gateway-local:latest
    container_name: irc-api-gateway
    build:
      context: .
      dockerfile: src/api_gateway/Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app/src
      - ORCHESTRATOR_URL=http://llm-orchestrator:8000 
    ports:
      - "127.0.0.1:8000:8000" 
    volumes:
      # PRODUCTION FIX: Read-only mount to prevent WSL sync freezes
      - ./src:/app/src:ro
    networks:
      - irc_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      llm-orchestrator:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "api_gateway.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # --- PHASE 8: Observability Stack (Prometheus, Alertmanager, Grafana) ---
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: irc-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus-alerts.yaml:/etc/prometheus/prometheus-alerts.yaml:ro
      - irc_prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - irc_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: irc-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - irc_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: irc-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - irc_grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - irc_network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  irc_network:
    driver: bridge
    name: irc_internal_network

volumes:
  irc_pgdata:
  irc_qdrant:
  irc_rag_processed:
  irc_hf_cache:
  irc_ollama_data:
  irc_prom_data:
  irc_grafana_data:
