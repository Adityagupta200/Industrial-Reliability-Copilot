services:
  postgres:
    image: postgres:16-alpine
    container_name: irc-postgres
    environment:
      POSTGRES_DB: industrial_maintenance
      POSTGRES_USER: irc
      POSTGRES_PASSWORD: irc_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - irc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irc -d industrial_maintenance"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    build:
      context: .
      dockerfile: qdrant.Dockerfile
    container_name: irc-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - irc_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  rag-service:
    container_name: irc-rag-service
    build:
      context: .
      dockerfile: src/rag_service/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+psycopg://irc:irc_password@postgres:5432/industrial_maintenance
      INCIDENTS_DB_DSN: postgresql://irc:irc_password@postgres:5432/industrial_maintenance
      HOST: 0.0.0.0
      PORT: "8002"
      PYTHONPATH: /app/src

      EMBEDDING_PROVIDER: bge
      BGE_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_NORMALIZE: "true"

    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/raw:/app/data/raw:ro
      - irc_rag_processed:/app/data/processed
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "rag_service.main:app",
        "--app-dir",
        "/app/src",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--log-level",
        "debug"
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  irc_pgdata:
  irc_qdrant:
  irc_rag_processed:
