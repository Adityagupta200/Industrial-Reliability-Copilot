name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest

  rag-regression-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-dev.txt
      
      - name: Install and Start Ollama (Local LLM)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3
          
      - name: Start Background Services
        run: docker-compose up -d db qdrant
        
      - name: Start API Server
        run: |
          uvicorn src.llm_orchestrator.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          
      - name: Run Ragas Offline Evaluation (Air-gapped)
        run: python src/evaluation/offline/ragas_eval.py
        
      - name: Enforce Quality Gate
        run: python scripts/rag_quality_gate.py