name: CI Pipeline

on:
  pull_request:
    branches: [main]

# Prevents redundant builds if new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required permission for actions/github-script to post Ragas results to the PR
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Lint code
        run: |
          black --check src/
          ruff check src/
          
      - name: Security scan
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json
          
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-fail-under=50
        
      - name: Run integration tests
        run: pytest tests/integration/ -v

  ragas-eval:
    name: LLM Quality Gate (Ragas)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Install and Start Ollama (Local Fallback LLM)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.1:8b-instruct
          
      - name: Start Background Services
        run: |
          docker-compose up -d db qdrant
          sleep 30
          
      - name: Start API Server
        env:
          LLM_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
        run: |
          uvicorn src.llm_orchestrator.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          
      - name: Run Ragas Offline Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python src/evaluation/offline/ragas_eval.py
        
      - name: Check quality thresholds
        run: python scripts/check_thresholds.py
        
      - name: Post results to PR
        uses: actions/github-script@v6
        if: always() 
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('ragas_results.json')) {
              const results = fs.readFileSync('ragas_results.json', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Ragas Evaluation Results\n\`\`\`json\n${results}\n\`\`\`\n*Automated quality gate generated by CI.*`
              });
            } else {
              console.log('ragas_results.json not found. Skipping PR comment.');
            }