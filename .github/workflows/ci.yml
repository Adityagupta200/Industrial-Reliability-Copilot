name: CI Pipeline

on:
  pull_request:
    branches: [main]

# Prevents redundant builds if new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required permission for actions/github-script to post Ragas results to the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Lint code
        run: |
          python -m black --check src/ tests/ scripts/
          python -m ruff check src/ tests/ scripts/
          
      - name: Security scan
        run: |
          pip install bandit
          set +e
          bandit -r src/ -f json -o bandit-report.json
          bandit_status=$?
          if [ "$bandit_status" -ne 0 ]; then
            echo "::group::Bandit findings"
            bandit -r src/
            echo "::endgroup::"
          fi
          exit "$bandit_status"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-fail-under=50
        
      - name: Run integration tests
        run: pytest tests/integration/ -v

  ragas-eval:
    name: LLM Quality Gate (Ragas)
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RAGAS_JUDGE_MODEL: gpt-4.1-mini
      RAGAS_EMBEDDING_MODEL: text-embedding-3-small
      LLM_PRIMARY_PROVIDER: openai
      LLM_FALLBACK_PROVIDER: openai
      LLM_OPENAI_MODEL: ${{ vars.LLM_OPENAI_MODEL || 'gpt-4.1-mini' }}
      LLM_OPENAI_JUDGE_MODEL: ${{ vars.LLM_OPENAI_JUDGE_MODEL || 'gpt-4.1-mini' }}
      LLM_MAX_TOKENS: "700"
      LLM_REQUEST_TIMEOUT_S: "30"
      ROOT_CAUSE_FAST_PATH_ENABLED: "true"
      ROOT_CAUSE_MAX_CONTEXT_DOCS: "4"
      ROOT_CAUSE_MAX_CHARS_PER_DOC: "1600"
      OUTPUT_GUARDRAILS_DETERMINISTIC_GROUNDEDNESS_THRESHOLD: "0.35"
      OUTPUT_GUARDRAILS_LLM_JUDGE_MODE: fallback
      EMBEDDING_PROVIDER: openai
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      QDRANT_URL: http://localhost:6333
      POSTGRES_DSN: postgresql+psycopg://irc:irc_password@localhost:5432/industrial_maintenance
      INCIDENTS_DB_DSN: postgresql+asyncpg://irc:irc_password@localhost:5432/industrial_maintenance
      ORCHESTRATOR_URL: http://127.0.0.1:8000/query
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate LLM provider
        run: |
          python scripts/llm_provider_preflight.py \
            --provider "$LLM_PRIMARY_PROVIDER" \
            --model "$LLM_OPENAI_MODEL"
          python scripts/llm_provider_preflight.py \
            --provider openai \
            --model "$LLM_OPENAI_JUDGE_MODEL"
          python scripts/llm_provider_preflight.py \
            --provider openai \
            --model "$RAGAS_JUDGE_MODEL"

      - name: Start backing services
        run: |
          docker compose up -d postgres qdrant

          for i in {1..60}; do
            docker exec irc-postgres pg_isready -U irc -d industrial_maintenance && break
            if [ "$i" = "60" ]; then exit 1; fi
            sleep 2
          done

          for i in {1..60}; do
            curl -sf http://127.0.0.1:6333/readyz && break
            if [ "$i" = "60" ]; then exit 1; fi
            sleep 2
          done

      - name: Seed evaluation stores
        run: |
          python -m rag_service.db.init_db
          python -m rag_service.db.ingest_incidents
          python -m rag_service.ingestion.pipeline

      - name: Start API services
        run: |
          uvicorn anomaly_service.main:app --host 0.0.0.0 --port 8001 &
          uvicorn rag_service.main:app --host 0.0.0.0 --port 8002 &
          uvicorn llm_orchestrator.main:app --host 0.0.0.0 --port 8000 &
          for url in \
            http://127.0.0.1:8001/health/ready \
            http://127.0.0.1:8002/health/ready \
            http://127.0.0.1:8000/health/ready; do
            for i in {1..60}; do
              curl -sf "$url" && break
              if [ "$i" = "60" ]; then
                echo "::error::Service did not become ready: $url"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Verify evaluation retrieval stores
        run: python scripts/wait_for_eval_stores.py
          
      - name: Run Ragas Offline Evaluation
        run: python src/evaluation/offline/ragas_eval.py

      - name: Render evaluation report
        run: python scripts/render_eval_report.py --output data/evaluation_results/pr_comment.md
        
      - name: Check quality thresholds
        run: python scripts/check_thresholds.py

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ragas-evaluation-artifacts
          path: |
            ragas_results.json
            data/evaluation_results/summary.json
            data/evaluation_results/latest_run.csv
            data/evaluation_results/evaluation_report.json
            data/evaluation_results/null_metric_diagnostics.json
            data/evaluation_results/pr_comment.md
          if-no-files-found: ignore
        
      - name: Post results to PR
        uses: actions/github-script@v8
        if: always() 
        with:
          script: |
            const fs = require('fs');
            const markdownPath = 'data/evaluation_results/pr_comment.md';
            const jsonPath = 'ragas_results.json';
            if (fs.existsSync(markdownPath)) {
              const body = fs.readFileSync(markdownPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else if (fs.existsSync(jsonPath)) {
              const results = fs.readFileSync(jsonPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## LLM Quality Gate\n\nMarkdown report was not generated. Raw results:\n\n\`\`\`json\n${results}\n\`\`\``
              });
            } else {
              console.log('ragas_results.json not found. Skipping PR comment.');
            }
