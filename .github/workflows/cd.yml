name: CD Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'industrial-copilot-cluster' }}
  STAGING_NAMESPACE: staging
  PRODUCTION_NAMESPACE: production
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com

jobs:
  preflight:
    name: Validate CD Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository secrets
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          INCIDENTS_DB_DSN: ${{ secrets.INCIDENTS_DB_DSN }}
        run: |
          missing=()
          for name in AWS_ACCOUNT_ID AWS_ROLE_TO_ASSUME OPENAI_API_KEY POSTGRES_PASSWORD POSTGRES_DSN INCIDENTS_DB_DSN; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required GitHub repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          echo "CD secret preflight passed."

      - name: Validate runtime database DSNs
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          INCIDENTS_DB_DSN: ${{ secrets.INCIDENTS_DB_DSN }}
        run: |
          python - <<'PY'
          import os
          import socket
          import sys
          from urllib.parse import urlparse

          checks = [
              ("POSTGRES_DSN", "postgresql+psycopg"),
              ("INCIDENTS_DB_DSN", "postgresql+asyncpg"),
          ]
          invalid_cluster_hosts = {"localhost", "127.0.0.1", "postgres"}
          failed = False

          def mask_dsn(value: str) -> str:
              if "://" not in value or "@" not in value:
                  return value
              scheme, rest = value.split("://", 1)
              return f"{scheme}://***@{rest.rsplit('@', 1)[-1]}"

          for name, expected_scheme in checks:
              dsn = os.environ.get(name, "")
              print(f"Validating {name}: {mask_dsn(dsn)}")

              if not dsn or "<" in dsn or ">" in dsn:
                  print(f"::error::{name} is missing or still contains a placeholder.")
                  failed = True
                  continue

              parsed = urlparse(dsn)
              if parsed.scheme != expected_scheme:
                  print(
                      f"::error::{name} must use scheme {expected_scheme}; "
                      f"found {parsed.scheme!r}."
                  )
                  failed = True

              if parsed.path != "/industrial_maintenance":
                  print(
                      f"::error::{name} must target /industrial_maintenance; "
                      f"found {parsed.path!r}."
                  )
                  failed = True

              host = parsed.hostname
              if not host:
                  print(f"::error::{name} is missing a hostname.")
                  failed = True
                  continue

              try:
                  port = parsed.port or 5432
              except ValueError as exc:
                  print(f"::error::{name} has an invalid port: {exc}")
                  failed = True
                  continue

              if host in invalid_cluster_hosts:
                  print(
                      f"::error::{name} host {host!r} is not valid for EKS/RDS. "
                      "Use the private RDS endpoint from Terraform output."
                  )
                  failed = True
                  continue

              try:
                  socket.getaddrinfo(host, port)
              except OSError as exc:
                  print(f"::error::{name} hostname {host!r}:{port} does not resolve: {exc}")
                  failed = True

          if failed:
              sys.exit(1)

          print("Database DSN preflight passed.")
          PY

  build-and-push:
    name: Build and Push Microservices to ECR (${{ matrix.image_repo }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_dir: anomaly_service
            image_repo: anomaly-service
          - service_dir: api_gateway
            image_repo: api-gateway
          - service_dir: llm_orchestrator
            image_repo: llm-orchestrator
          - service_dir: rag_service
            image_repo: rag-service
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Verify ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.image_repo }}" >/dev/null

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        run: |
          image="${ECR_REGISTRY}/${{ matrix.image_repo }}:${GITHUB_SHA}"
          docker build \
            -f "src/${{ matrix.service_dir }}/Dockerfile" \
            -t "$image" \
            .
          docker push "$image"

  deploy-staging:
    name: Deploy to Staging & Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Connect to EKS
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          echo "GitHub Actions deploy role expected by Terraform: ${AWS_ROLE_TO_ASSUME}"
          echo "AWS caller assumed by this workflow:"
          aws sts get-caller-identity
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl version --client=true
          kubectl auth can-i create namespaces || {
            echo "::error::The GitHub Actions deploy role is not authorized in EKS. Re-run Terraform with -var=\"github_actions_role_arn=${AWS_ROLE_TO_ASSUME}\" and verify the EKS access entry exists."
            exit 1
          }
          kubectl auth can-i create deployments --namespace "$STAGING_NAMESPACE"
          kubectl auth can-i create secrets --namespace "$STAGING_NAMESPACE"

      - name: Verify staging rollout capacity
        run: |
          python scripts/k8s_capacity_guard.py \
            --min-ready-nodes 3 \
            --min-free-cpu-millicores 2000 \
            --min-free-memory-mib 2048 \
            --min-node-free-cpu-millicores 500 \
            --min-node-free-memory-mib 1536

      - name: Render Kubernetes manifests for staging
        run: |
          mkdir -p rendered/staging
          cp infra/kubernetes/*.yaml rendered/staging/

          sed -i "s/namespace: industrial-copilot/namespace: ${STAGING_NAMESPACE}/g" rendered/staging/*.yaml
          sed -i "s/name: industrial-copilot/name: ${STAGING_NAMESPACE}/g" rendered/staging/01_config.yaml
          sed -i 's/ENVIRONMENT: "production"/ENVIRONMENT: "staging"/g' rendered/staging/01_config.yaml
          sed -i "s|image: .*anomaly-service:.*|image: ${ECR_REGISTRY}/anomaly-service:${GITHUB_SHA}|g" rendered/staging/03-microservices.yaml
          sed -i "s|image: .*api-gateway:.*|image: ${ECR_REGISTRY}/api-gateway:${GITHUB_SHA}|g" rendered/staging/03-microservices.yaml
          sed -i "s|image: .*llm-orchestrator:.*|image: ${ECR_REGISTRY}/llm-orchestrator:${GITHUB_SHA}|g" rendered/staging/03-microservices.yaml
          sed -i "s|image: .*rag-service:.*|image: ${ECR_REGISTRY}/rag-service:${GITHUB_SHA}|g" rendered/staging/03-microservices.yaml

      - name: Deploy staging manifests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          INCIDENTS_DB_DSN: ${{ secrets.INCIDENTS_DB_DSN }}
        run: |
          kubectl create namespace "$STAGING_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f rendered/staging/01_config.yaml

          kubectl -n "$STAGING_NAMESPACE" create secret generic copilot-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DSN="$POSTGRES_DSN" \
            --from-literal=INCIDENTS_DB_DSN="$INCIDENTS_DB_DSN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f rendered/staging/02-backing-services.yaml
          kubectl apply -f rendered/staging/03-microservices.yaml

          for deployment in qdrant anomaly-service rag-service llm-orchestrator api-gateway; do
            kubectl annotate deployment "$deployment" \
              -n "$STAGING_NAMESPACE" \
              kubernetes.io/change-cause="staging deploy ${GITHUB_SHA} via ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}" \
              --overwrite
          done

      - name: Wait for staging rollout
        run: |
          python scripts/k8s_rollout_guard.py \
            --namespace "$STAGING_NAMESPACE" \
            --deployment qdrant:300 \
            --deployment anomaly-service:600 \
            --deployment rag-service:900 \
            --deployment llm-orchestrator:900 \
            --deployment api-gateway:600

      - name: Collect staging diagnostics on failure
        if: failure()
        run: |
          kubectl get storageclass -o wide || true
          kubectl get pvc,pv -n "$STAGING_NAMESPACE" -o wide || true
          kubectl describe pvc qdrant-storage -n "$STAGING_NAMESPACE" || true
          kubectl get nodes -o wide || true
          kubectl describe nodes || true
          kubectl get events -n "$STAGING_NAMESPACE" --sort-by=.lastTimestamp || true
          kubectl get hpa -n "$STAGING_NAMESPACE" -o wide || true
          kubectl get pods -n "$STAGING_NAMESPACE" -o wide || true
          kubectl describe deployment qdrant -n "$STAGING_NAMESPACE" || true
          kubectl describe pods -l app=qdrant -n "$STAGING_NAMESPACE" || true
          kubectl logs -l app=qdrant -n "$STAGING_NAMESPACE" --tail=200 || true
          kubectl describe deployment anomaly-service -n "$STAGING_NAMESPACE" || true
          kubectl describe pods -l app=anomaly-service -n "$STAGING_NAMESPACE" || true
          kubectl logs -l app=anomaly-service -n "$STAGING_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=anomaly-service -n "$STAGING_NAMESPACE" --tail=200 || true
          kubectl describe deployment rag-service -n "$STAGING_NAMESPACE" || true
          kubectl describe pods -l app=rag-service -n "$STAGING_NAMESPACE" || true
          kubectl logs -l app=rag-service -n "$STAGING_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=rag-service -n "$STAGING_NAMESPACE" --tail=200 || true
          kubectl describe deployment llm-orchestrator -n "$STAGING_NAMESPACE" || true
          kubectl describe pods -l app=llm-orchestrator -n "$STAGING_NAMESPACE" || true
          kubectl logs -l app=llm-orchestrator -n "$STAGING_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=llm-orchestrator -n "$STAGING_NAMESPACE" --tail=200 || true
          kubectl describe deployment api-gateway -n "$STAGING_NAMESPACE" || true
          kubectl describe pods -l app=api-gateway -n "$STAGING_NAMESPACE" || true
          kubectl logs -l app=api-gateway -n "$STAGING_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=api-gateway -n "$STAGING_NAMESPACE" --tail=200 || true

      - name: Run staging smoke tests
        run: |
          kubectl -n "$STAGING_NAMESPACE" run "smoke-${GITHUB_RUN_ID}" \
            --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
            sh -c 'curl -fsS http://api-gateway/health/ready && curl -fsS http://llm-orchestrator:8000/health/ready'

  deploy-prod:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest

      - name: Connect to EKS
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          echo "GitHub Actions deploy role expected by Terraform: ${AWS_ROLE_TO_ASSUME}"
          echo "AWS caller assumed by this workflow:"
          aws sts get-caller-identity
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl auth can-i create namespaces || {
            echo "::error::The GitHub Actions deploy role is not authorized in EKS. Re-run Terraform with -var=\"github_actions_role_arn=${AWS_ROLE_TO_ASSUME}\" and verify the EKS access entry exists."
            exit 1
          }
          kubectl auth can-i create deployments --namespace "$PRODUCTION_NAMESPACE"
          kubectl auth can-i create secrets --namespace "$PRODUCTION_NAMESPACE"

      - name: Verify production rollout capacity
        run: |
          python scripts/k8s_capacity_guard.py \
            --min-ready-nodes 3 \
            --min-free-cpu-millicores 2000 \
            --min-free-memory-mib 2048 \
            --min-node-free-cpu-millicores 500 \
            --min-node-free-memory-mib 1536

      - name: Render Kubernetes manifests for production
        run: |
          mkdir -p rendered/production
          cp infra/kubernetes/*.yaml rendered/production/

          sed -i "s/namespace: industrial-copilot/namespace: ${PRODUCTION_NAMESPACE}/g" rendered/production/*.yaml
          sed -i "s/name: industrial-copilot/name: ${PRODUCTION_NAMESPACE}/g" rendered/production/01_config.yaml
          sed -i "s|image: .*anomaly-service:.*|image: ${ECR_REGISTRY}/anomaly-service:${GITHUB_SHA}|g" rendered/production/03-microservices.yaml
          sed -i "s|image: .*api-gateway:.*|image: ${ECR_REGISTRY}/api-gateway:${GITHUB_SHA}|g" rendered/production/03-microservices.yaml
          sed -i "s|image: .*llm-orchestrator:.*|image: ${ECR_REGISTRY}/llm-orchestrator:${GITHUB_SHA}|g" rendered/production/03-microservices.yaml
          sed -i "s|image: .*rag-service:.*|image: ${ECR_REGISTRY}/rag-service:${GITHUB_SHA}|g" rendered/production/03-microservices.yaml

      - name: Deploy to production
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          INCIDENTS_DB_DSN: ${{ secrets.INCIDENTS_DB_DSN }}
        run: |
          kubectl create namespace "$PRODUCTION_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f rendered/production/01_config.yaml

          kubectl -n "$PRODUCTION_NAMESPACE" create secret generic copilot-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DSN="$POSTGRES_DSN" \
            --from-literal=INCIDENTS_DB_DSN="$INCIDENTS_DB_DSN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f rendered/production/02-backing-services.yaml
          kubectl apply -f rendered/production/03-microservices.yaml

          for deployment in qdrant anomaly-service rag-service llm-orchestrator api-gateway; do
            kubectl annotate deployment "$deployment" \
              -n "$PRODUCTION_NAMESPACE" \
              kubernetes.io/change-cause="production deploy ${GITHUB_SHA} via ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}" \
              --overwrite
          done

      - name: Wait for production rollout
        run: |
          python scripts/k8s_rollout_guard.py \
            --namespace "$PRODUCTION_NAMESPACE" \
            --deployment qdrant:300 \
            --deployment anomaly-service:600 \
            --deployment rag-service:900 \
            --deployment llm-orchestrator:900 \
            --deployment api-gateway:600

      - name: Collect production diagnostics on failure
        if: failure()
        run: |
          kubectl get storageclass -o wide || true
          kubectl get pvc,pv -n "$PRODUCTION_NAMESPACE" -o wide || true
          kubectl describe pvc qdrant-storage -n "$PRODUCTION_NAMESPACE" || true
          kubectl get nodes -o wide || true
          kubectl describe nodes || true
          kubectl get events -n "$PRODUCTION_NAMESPACE" --sort-by=.lastTimestamp || true
          kubectl get hpa -n "$PRODUCTION_NAMESPACE" -o wide || true
          kubectl get pods -n "$PRODUCTION_NAMESPACE" -o wide || true
          kubectl describe deployment qdrant -n "$PRODUCTION_NAMESPACE" || true
          kubectl describe pods -l app=qdrant -n "$PRODUCTION_NAMESPACE" || true
          kubectl logs -l app=qdrant -n "$PRODUCTION_NAMESPACE" --tail=200 || true
          kubectl describe deployment anomaly-service -n "$PRODUCTION_NAMESPACE" || true
          kubectl describe pods -l app=anomaly-service -n "$PRODUCTION_NAMESPACE" || true
          kubectl logs -l app=anomaly-service -n "$PRODUCTION_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=anomaly-service -n "$PRODUCTION_NAMESPACE" --tail=200 || true
          kubectl describe deployment rag-service -n "$PRODUCTION_NAMESPACE" || true
          kubectl describe pods -l app=rag-service -n "$PRODUCTION_NAMESPACE" || true
          kubectl logs -l app=rag-service -n "$PRODUCTION_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=rag-service -n "$PRODUCTION_NAMESPACE" --tail=200 || true
          kubectl describe deployment llm-orchestrator -n "$PRODUCTION_NAMESPACE" || true
          kubectl describe pods -l app=llm-orchestrator -n "$PRODUCTION_NAMESPACE" || true
          kubectl logs -l app=llm-orchestrator -n "$PRODUCTION_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=llm-orchestrator -n "$PRODUCTION_NAMESPACE" --tail=200 || true
          kubectl describe deployment api-gateway -n "$PRODUCTION_NAMESPACE" || true
          kubectl describe pods -l app=api-gateway -n "$PRODUCTION_NAMESPACE" || true
          kubectl logs -l app=api-gateway -n "$PRODUCTION_NAMESPACE" --previous --tail=200 || true
          kubectl logs -l app=api-gateway -n "$PRODUCTION_NAMESPACE" --tail=200 || true

      - name: Monitor deployment
        run: |
          kubectl -n "$PRODUCTION_NAMESPACE" port-forward svc/api-gateway 18080:80 >/tmp/api-gateway-port-forward.log 2>&1 &
          echo "$!" > /tmp/api-gateway-port-forward.pid
          sleep 5
          python -m pip install --upgrade pip
          pip install requests
          python scripts/monitor_deployment.py \
            --duration=600 \
            --namespace="$PRODUCTION_NAMESPACE" \
            --gateway-url=http://127.0.0.1:18080

      - name: Automated rollback on failure
        if: failure()
        run: |
          echo "Deployment or monitoring failed. Initiating automated rollback."
          kubectl rollout undo deployment/api-gateway -n "$PRODUCTION_NAMESPACE" || true
          kubectl rollout undo deployment/llm-orchestrator -n "$PRODUCTION_NAMESPACE" || true
          kubectl rollout undo deployment/rag-service -n "$PRODUCTION_NAMESPACE" || true
          kubectl rollout undo deployment/anomaly-service -n "$PRODUCTION_NAMESPACE" || true
          echo "Rollback complete. Please investigate logs."
